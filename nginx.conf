worker_processes 2;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    keepalive_timeout  60;

    # Everything is revalidated (cheap with ETags) except the files whose names
    # change with their content. Set once for the whole server, because an
    # add_header inside a location drops every add_header inherited from above.
    map $uri $cache_control {
        default                     "no-cache";
        ~^/assets/                  "public, max-age=31536000, immutable";
        ~^/workbox-[0-9a-f]+\.js$   "public, max-age=31536000, immutable";
    }

    server {
        listen        80;
        server_name   strnadi.cz;
        brotli_static on;
        root /usr/share/nginx/html;

        # Not "always": an error response must not be cached for a year.
        add_header Cache-Control $cache_control;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://appleid.apple.com https://accounts.google.com" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        # Files that exist or don't. Answering a chunk of a replaced build with
        # index.html makes the old page fail with a MIME error instead of a 404
        # it can recover from, and the service worker must never be HTML.
        location ~ ^/(?:assets|models|wasm)/ {
            try_files $uri =404;
        }

        location ~ ^/(?:sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }

        location = /.well-known/apple-app-site-association {
            default_type application/json;
            try_files    $uri =404;
        }
    }
}
